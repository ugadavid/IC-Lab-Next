<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Anonymisation audio — Proto05</title>
  <link rel="stylesheet" href="/shared/teacher-shell.css">
  <link rel="stylesheet" href="/shared/precise-video-time.css">
  <script src="/shared/teacher-shell.js" defer></script>
  <style>
    :root{font-family:system-ui,sans-serif;color:#172033;background:#eef2f7}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,.button{border:1px solid #164e63;border-radius:.5rem;padding:.58rem .8rem;background:#164e63;color:#fff;cursor:pointer;text-decoration:none}button.secondary,.button.secondary{background:#fff;color:#164e63}button.danger{border-color:#b91c1c;background:#fff;color:#b91c1c}button:disabled{opacity:.55;cursor:not-allowed}main{max-width:1500px;margin:auto;padding:1rem}.heading{display:flex;gap:1rem;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}.heading h1{font-size:1.45rem;margin:.2rem 0}.save-state{border-radius:999px;padding:.38rem .7rem;background:#e0f2fe;color:#075985}.save-state.dirty{background:#fff7ed;color:#9a3412}.save-state.error{background:#fee2e2;color:#991b1b}.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,.65fr);gap:1rem;margin-top:1rem}.panel{background:#fff;border:1px solid #d7dee8;border-radius:.8rem;padding:1rem;min-width:0}.video{width:100%;max-height:58vh;background:#0f172a;border-radius:.65rem}.transport,.actions,.bounds{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-top:.75rem}.clock{font-variant-numeric:tabular-nums;font-weight:700;min-width:8rem}.preview-note,.hint,.summary{color:#526174;font-size:.88rem}.preview-mode[aria-pressed="true"]{box-shadow:0 0 0 3px #22c55e66}.form{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}.form label{display:grid;gap:.28rem;font-size:.86rem;color:#475569}.form .wide{grid-column:1/-1}.form input,.form select,.form textarea{width:100%;padding:.52rem;border:1px solid #9aa5b8;border-radius:.45rem;background:#fff}.form textarea{min-height:4.4rem;resize:vertical}.field-error{color:#b91c1c;min-height:1.3rem;margin:.55rem 0}.passages{display:grid;gap:.55rem;margin-top:.85rem}.passage{border:1px solid #cbd5e1;border-radius:.6rem;padding:.7rem;background:#f8fafc}.passage.selected{border-color:#0e7490;box-shadow:0 0 0 2px #0e749022}.passage header{display:flex;gap:.6rem;justify-content:space-between}.passage p{margin:.25rem 0;font-size:.86rem}.status{min-height:1.5rem;margin:.75rem 0;color:#166534}.status.error{color:#b91c1c}.progress{height:.65rem;background:#e2e8f0;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:#0e7490;transition:width .2s}.result{margin-top:.65rem}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:900px){.layout{grid-template-columns:1fr}.video{max-height:48vh}}@media(max-width:540px){main{padding:.6rem}.panel{padding:.75rem}.form{grid-template-columns:1fr}.form .wide{grid-column:auto}.transport button{flex:1}}
  </style>
</head>
<body>
<main id="teacher-main">
  <div class="heading"><div><a href="/teacher/videos">← Retour à la vidéothèque</a><h1>Anonymiser le son</h1><p class="hint" id="sourceSummary">Chargement de la source…</p></div><span id="saveState" class="save-state">Chargement…</span></div>
  <div class="layout">
    <section class="panel" aria-labelledby="previewTitle">
      <h2 id="previewTitle">Prévisualisation audio</h2>
      <video id="video" class="video" controls preload="metadata"></video>
      <div id="videoTransport"></div>
      <div class="transport"><button id="previous" class="secondary" type="button">Passage précédent</button><button id="next" class="secondary" type="button">Passage suivant</button></div>
      <div class="transport" aria-label="Mode de prévisualisation"><button id="originalMode" class="secondary preview-mode" type="button" aria-pressed="true">Son original</button><button id="effectMode" class="secondary preview-mode" type="button" aria-pressed="false">Aperçu anonymisé</button></div>
      <p class="preview-note">L’aperçu local reproduit les effets et leurs bornes. L’export FFmpeg reste la référence exacte du fichier produit.</p>
      <div class="bounds"><button id="setStart" class="secondary" type="button">Définir le début au curseur</button><button id="setEnd" class="secondary" type="button">Définir la fin au curseur</button></div>
      <hr>
      <h2>Passage sélectionné</h2>
      <div class="form">
        <label>Début (s)<input id="start" type="number" min="0" step="0.001" inputmode="decimal"></label>
        <label>Fin (s)<input id="end" type="number" min="0" step="0.001" inputmode="decimal"></label>
        <label>Remplacement<select id="replacement"><option value="soft-tone">Tonalité douce</option><option value="beep">Bip</option><option value="silence">Silence</option></select></label>
        <label>Libellé facultatif<input id="label" maxlength="500"></label>
        <label class="wide">Raison facultative<textarea id="reason" maxlength="1000"></textarea></label>
      </div>
      <p id="fieldError" class="field-error" role="alert"></p>
      <div class="actions"><button id="apply" type="button">Ajouter ce passage</button><button id="clear" class="secondary" type="button">Nouveau passage</button><button id="remove" class="danger" type="button" disabled>Supprimer</button></div>
    </section>
    <aside class="panel" aria-labelledby="planTitle">
      <h2 id="planTitle">Plan multi-zones</h2>
      <p id="planSummary" class="summary">Aucun passage.</p>
      <div id="passages" class="passages"></div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div class="actions"><button id="save" type="button">Enregistrer le plan</button><button id="derive" type="button">Lancer l’anonymisation</button><button id="cancel" class="secondary" type="button" disabled>Annuler le traitement</button></div>
      <div class="progress" aria-label="Progression"><span id="progress"></span></div>
      <div id="result" class="result"></div>
    </aside>
  </div>
</main>
<script src="/shared/precise-video-time.js"></script>
<script>
"use strict";
const preparationJobId=decodeURIComponent(location.pathname.split('/').pop());
const $=id=>document.getElementById(id);
const state={preparation:null,plan:null,selected:null,dirty:false,job:null,previewMode:'original',audio:null};
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const ms=value=>Math.round(Number(value)*1000);
const seconds=value=>(Number(value)/1000).toFixed(3);
const clock=value=>{const total=Math.max(0,Number(value)||0),minutes=Math.floor(total/60000),rest=total-minutes*60000;return `${String(minutes).padStart(2,'0')}:${(rest/1000).toFixed(3).padStart(6,'0')}`};
async function api(path,options={}){const response=await fetch(path,{headers:{'content-type':'application/json',...(options.headers||{})},...options});let payload={};try{payload=await response.json()}catch{}if(!response.ok)throw Object.assign(new Error(payload.error||`Erreur HTTP ${response.status}`),{status:response.status,payload});return payload}
function setStatus(message,type=''){const node=$('status');node.textContent=message;node.className=`status ${type}`.trim()}
function setDirty(value){state.dirty=value;const node=$('saveState');node.textContent=value?'Modifications non enregistrées':'Plan enregistré';node.className=`save-state ${value?'dirty':''}`.trim()}
function activePassage(timeMs){return state.plan?.passages.find(item=>timeMs>=item.startMs&&timeMs<item.endMs)||null}
function clearForm(){state.selected=null;$('start').value=seconds(Math.round($('video').currentTime*1000));$('end').value=seconds(Math.min(state.plan?.durationMs||0,Math.round($('video').currentTime*1000)+1000));$('replacement').value='soft-tone';$('label').value='';$('reason').value='';$('fieldError').textContent='';$('apply').textContent='Ajouter ce passage';$('remove').disabled=true;render()}
function selectPassage(id,{seek=true}={}){const item=state.plan.passages.find(value=>value.id===id);if(!item)return;state.selected=id;$('start').value=seconds(item.startMs);$('end').value=seconds(item.endMs);$('replacement').value=item.replacementType;$('label').value=item.label||'';$('reason').value=item.reason||'';$('apply').textContent='Mettre à jour ce passage';$('remove').disabled=false;if(seek)$('video').currentTime=item.startMs/1000;render()}
function validateCandidate(){const startMs=ms($('start').value),endMs=ms($('end').value),durationMs=state.plan.durationMs;if(!Number.isFinite(startMs)||!Number.isFinite(endMs))throw new Error('Renseignez des bornes temporelles valides.');if(startMs<0)throw new Error('Le début doit être positif ou nul.');if(endMs<=startMs)throw new Error('La fin doit être postérieure au début.');if(endMs>durationMs)throw new Error('La fin dépasse la durée de la vidéo.');const collision=state.plan.passages.find(item=>item.id!==state.selected&&startMs<item.endMs&&endMs>item.startMs);if(collision)throw new Error(`Ce passage chevauche ${collision.label||collision.id}. Les passages contigus sont autorisés.`);return{id:state.selected||`audio-zone-${Date.now()}-${Math.random().toString(16).slice(2,8)}`,startMs,endMs,replacementType:$('replacement').value,label:$('label').value.trim()||null,reason:$('reason').value.trim()||null}}
function applyPassage(){try{const candidate=validateCandidate(),index=state.plan.passages.findIndex(item=>item.id===candidate.id);if(index>=0)state.plan.passages[index]=candidate;else state.plan.passages.push(candidate);state.plan.passages.sort((a,b)=>a.startMs-b.startMs||a.endMs-b.endMs||a.id.localeCompare(b.id));state.selected=candidate.id;$('fieldError').textContent='';setDirty(true);selectPassage(candidate.id,{seek:false});setStatus('Passage conservé dans le brouillon. Enregistrez le plan.')}catch(error){$('fieldError').textContent=error.message}}
function removePassage(){if(!state.selected)return;state.plan.passages=state.plan.passages.filter(item=>item.id!==state.selected);setDirty(true);clearForm();setStatus('Passage supprimé du brouillon. Enregistrez le plan.')}
function render(){if(!state.plan)return;const list=$('passages');list.replaceChildren();for(const item of state.plan.passages){const article=document.createElement('article');article.className=`passage${item.id===state.selected?' selected':''}`;article.dataset.passage=item.id;article.innerHTML=`<header><strong>${esc(item.label||item.id)}</strong><span>${esc(item.replacementType==='soft-tone'?'Tonalité douce':item.replacementType==='beep'?'Bip':'Silence')}</span></header><p>${clock(item.startMs)} → ${clock(item.endMs)}</p><div class="actions"><button type="button" class="secondary" data-select>Modifier</button><button type="button" class="secondary" data-seek>Lire depuis le début</button></div>`;article.querySelector('[data-select]').onclick=()=>selectPassage(item.id);article.querySelector('[data-seek]').onclick=()=>{$('video').currentTime=item.startMs/1000;$('video').play()};list.append(article)}const total=state.plan.passages.reduce((sum,item)=>sum+item.endMs-item.startMs,0);$('planSummary').textContent=`${state.plan.passages.length} passage(s) · ${clock(total)} anonymisées · intervalles contigus autorisés, chevauchements refusés.`}
async function savePlan(){try{$('save').disabled=true;setStatus('Enregistrement du plan…');const payload=await api(`/api/proto05/library/audio-anonymization/plans/${encodeURIComponent(state.plan.id)}`,{method:'PUT',body:JSON.stringify({preparationJobId,revision:state.plan.revision,passages:state.plan.passages})});state.plan=payload.plan;setDirty(false);render();setStatus('Plan enregistré dans MariaDB.');return state.plan}catch(error){$('saveState').textContent='Échec de l’enregistrement';$('saveState').className='save-state error';setStatus(error.message,'error');throw error}finally{$('save').disabled=false}}
async function derive(){try{if(state.dirty)await savePlan();if(!state.plan.passages.length)throw new Error('Ajoutez au moins un passage avant de lancer le traitement.');$('derive').disabled=true;$('cancel').disabled=false;setStatus('Démarrage de l’anonymisation audio…');const payload=await api('/api/proto05/library/audio-anonymization/derivations',{method:'POST',body:JSON.stringify({preparationJobId,planId:state.plan.id})});state.job=payload.job;poll()}catch(error){$('derive').disabled=false;$('cancel').disabled=true;setStatus(error.message,'error')}}
async function poll(){if(!state.job)return;try{const payload=await api(`/api/proto05/library/audio-anonymization/derivations/${encodeURIComponent(state.job.id)}`);state.job=payload.job;$('progress').style.width=`${state.job.progress||0}%`;if(state.job.statusCode==='completed'){$('derive').disabled=false;$('cancel').disabled=true;setStatus('Version audio anonymisée créée.');$('result').innerHTML=`<a class="button secondary" target="_blank" rel="noopener" href="${esc(state.job.metadata.mediaUrl)}">Ouvrir la version dérivée</a>`;return}if(['failed','cancelled','expired'].includes(state.job.statusCode)){$('derive').disabled=false;$('cancel').disabled=true;setStatus(state.job.error||'Le traitement n’a pas abouti.','error');return}setStatus(`Traitement : ${state.job.status} (${state.job.progress||0} %).`);setTimeout(poll,600)}catch(error){setStatus(error.message,'error');$('derive').disabled=false;$('cancel').disabled=true}}
async function cancel(){if(!state.job)return;try{$('cancel').disabled=true;await api(`/api/proto05/library/audio-anonymization/derivations/${encodeURIComponent(state.job.id)}`,{method:'DELETE'});setStatus('Annulation demandée.');setTimeout(poll,200)}catch(error){setStatus(error.message,'error')}}
function audioGraph(){if(state.audio)return state.audio;const context=new AudioContext(),source=context.createMediaElementSource($('video')),dry=context.createGain(),softA=context.createOscillator(),softB=context.createOscillator(),beep=context.createOscillator(),softGainA=context.createGain(),softGainB=context.createGain(),beepGain=context.createGain();softA.frequency.value=196;softB.frequency.value=246.94;beep.frequency.value=880;softGainA.gain.value=softGainB.gain.value=beepGain.gain.value=0;source.connect(dry).connect(context.destination);softA.connect(softGainA).connect(context.destination);softB.connect(softGainB).connect(context.destination);beep.connect(beepGain).connect(context.destination);softA.start();softB.start();beep.start();state.audio={context,dry,softGainA,softGainB,beepGain};return state.audio}
function updatePreview(){if(state.audio){const graph=state.audio,now=graph.context.currentTime,passage=state.previewMode==='effect'?activePassage(Math.round($('video').currentTime*1000)):null;graph.dry.gain.setTargetAtTime(passage?0:1,now,.008);graph.softGainA.gain.setTargetAtTime(passage?.replacementType==='soft-tone' ? .045 : 0,now,.008);graph.softGainB.gain.setTargetAtTime(passage?.replacementType==='soft-tone' ? .035 : 0,now,.008);graph.beepGain.gain.setTargetAtTime(passage?.replacementType==='beep' ? .09 : 0,now,.008)}requestAnimationFrame(updatePreview)}
async function setPreviewMode(mode){const graph=audioGraph();await graph.context.resume();state.previewMode=mode;$('originalMode').setAttribute('aria-pressed',String(mode==='original'));$('effectMode').setAttribute('aria-pressed',String(mode==='effect'));setStatus(mode==='effect'?'Aperçu anonymisé actif.':'Son original actif.')}
function adjacent(direction){if(!state.plan.passages.length)return;const current=state.plan.passages.findIndex(item=>item.id===state.selected),index=current<0?(direction>0?0:state.plan.passages.length-1):(current+direction+state.plan.passages.length)%state.plan.passages.length;selectPassage(state.plan.passages[index].id)}
async function initialize(){try{const preparation=await api(`/api/proto05/library/hls-preparations/${encodeURIComponent(preparationJobId)}`);if(preparation.job.status!=='completed')throw new Error('La préparation vidéo n’est pas terminée.');state.preparation=preparation.job;$('video').src=`/api/proto05/library/hls-preparations/${encodeURIComponent(preparationJobId)}/media`;$('sourceSummary').textContent=`${preparation.job.metadata?.sourceTitle||preparation.job.assetId} · ${clock(preparation.job.metadata?.durationMs||0)}`;const loaded=await api(`/api/proto05/library/audio-anonymization/plans?assetId=${encodeURIComponent(preparation.job.assetId)}&playableId=${encodeURIComponent(preparation.job.playableId)}`);state.plan=loaded.plan||{id:loaded.suggestedPlanId,sourceAssetId:preparation.job.assetId,sourcePlayableId:preparation.job.playableId,durationMs:preparation.job.metadata.durationMs,revision:0,passages:[]};setDirty(Boolean(!loaded.plan));clearForm();render();setStatus(loaded.plan?'Plan MariaDB rechargé.':'Nouveau plan prêt à être renseigné.')}catch(error){setStatus(error.message,'error');$('saveState').textContent='Indisponible';$('saveState').className='save-state error';document.querySelectorAll('button').forEach(button=>button.disabled=true)}}
$('apply').onclick=applyPassage;$('clear').onclick=clearForm;$('remove').onclick=removePassage;$('save').onclick=()=>savePlan().catch(()=>{});$('derive').onclick=derive;$('cancel').onclick=cancel;$('setStart').onclick=()=>{$('start').value=seconds(Math.round($('video').currentTime*1000));$('fieldError').textContent=''};$('setEnd').onclick=()=>{$('end').value=seconds(Math.round($('video').currentTime*1000));$('fieldError').textContent=''};$('originalMode').onclick=()=>setPreviewMode('original');$('effectMode').onclick=()=>setPreviewMode('effect');$('previous').onclick=()=>adjacent(-1);$('next').onclick=()=>adjacent(1);for(const id of ['start','end','replacement','label','reason'])$(id).addEventListener('input',()=>{$('fieldError').textContent=''});Proto05PreciseVideoTime.mount({video:$('video'),root:$('videoTransport'),onPlayError:error=>setStatus(error.message||'Lecture vidéo impossible.','error')});updatePreview();initialize();
</script>
</body>
</html>
