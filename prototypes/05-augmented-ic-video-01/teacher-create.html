<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Créer une activité — Prototype 05</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#172033;background:#f6f7fb}*{box-sizing:border-box}body{margin:0;padding:1.5rem}main{max-width:1240px;margin:auto}.panel{background:#fff;border:1px solid #dbe1ea;border-radius:14px;padding:1rem;margin-bottom:1rem;box-shadow:0 2px 16px #17203312}.topbar{display:flex;justify-content:space-between;gap:1rem;align-items:start}.topbar a,a{color:#164e63}.toolbar{display:grid;grid-template-columns:minmax(240px,2fr) minmax(180px,1fr);gap:.75rem;align-items:end}label{display:block;font-weight:650;margin-bottom:.35rem}input,textarea,select,button{font:inherit;border:1px solid #9aa5b8;border-radius:7px;padding:.55rem}input,textarea,select{width:100%;background:#fff}textarea{min-height:90px;resize:vertical}button{background:#164e63;color:#fff;cursor:pointer}button.secondary{background:#fff;color:#164e63}.actions{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:.75rem}.status{min-height:1.5rem}.status.error{color:#a21caf}.status.ok{color:#166534}.asset-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:1rem}.asset{border:1px solid #dbe1ea;border-radius:12px;padding:1rem;min-width:0}.asset.selected{border:2px solid #0e7490}.asset h3{overflow-wrap:anywhere}.meta{font-size:.86rem;color:#475569;overflow-wrap:anywhere}.badge{display:inline-block;border-radius:999px;padding:.18rem .5rem;background:#e0f2fe;color:#075985;font-size:.78rem;margin:.15rem}.source{border-top:1px solid #e5e7eb;margin-top:.7rem;padding-top:.6rem}.source code{display:block;overflow-wrap:anywhere;font-size:.78rem}.preview{margin-top:.7rem}.preview-mount{aspect-ratio:16/9;background:#0f172a;border-radius:8px;overflow:hidden}.preview-mount video,.preview-mount iframe{width:100%;height:100%;display:block}@media(max-width:760px){body{padding:.8rem}.topbar{display:block}.toolbar{grid-template-columns:1fr}}
  </style>
  <link rel="stylesheet" href="/shared/teacher-shell.css">
  <script src="/shared/teacher-shell.js" defer></script>
</head>
<body><main>
  <header class="topbar"><div><h1>Créer une activité</h1><p>Choisissez explicitement un asset et un playable de la Library vidéo.</p></div></header>
  <section class="panel"><h2>Métadonnées</h2><label for="title">Titre</label><input id="title" value="Nouvelle activité"><label for="description">Description</label><textarea id="description"></textarea></section>
  <section class="panel"><h2>Choisir une vidéo dans la Library</h2><div class="toolbar"><div><label for="librarySearch">Recherche</label><input id="librarySearch" type="search" placeholder="Titre, identifiant ou type"></div><div><label for="libraryFilter">Source</label><select id="libraryFilter"><option value="all">Toutes</option><option value="local-file">Fichier local</option><option value="direct-url">URL directe</option><option value="hls">HLS</option><option value="youtube-embed">YouTube</option></select></div></div><p id="selection" class="status" aria-live="polite">Aucun playable sélectionné.</p><div id="assets" class="asset-grid"><p>Chargement…</p></div></section>
  <div class="actions"><button id="create" disabled>Créer le brouillon</button><a href="/teacher">Annuler</a></div><p id="status" class="status" role="status" aria-live="polite"></p>
</main>
<script src="/shared/ic-video-player.js"></script>
<script>
const $=id=>document.getElementById(id),state={assets:[],assetId:null,playableId:null,player:null};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=k=>({'local-file':'Fichier local','direct-url':'URL directe','hls':'HLS','youtube-embed':'YouTube'}[k]||k);
function setStatus(message,type=''){const n=$('status');n.textContent=message;n.className='status '+type}
function matches(asset){const q=$('librarySearch').value.trim().toLowerCase(),f=$('libraryFilter').value;return(!q||JSON.stringify(asset).toLowerCase().includes(q))&&(f==='all'||asset.sources.some(s=>s.kind===f)||asset.playables.some(p=>p.kind===f))}
function selectPlayable(assetId,playableId){state.assetId=assetId;state.playableId=playableId;$('create').disabled=false;$('selection').textContent=`Sélection : ${assetId} / ${playableId}`;render()}
async function preview(assetId,playableId){const asset=state.assets.find(a=>a.id===assetId),p=asset?.playables.find(x=>x.id===playableId),mount=$(`mount-${playableId}`);if(!p||!mount)return;mount.parentElement.hidden=false;state.player?.destroy?.();mount.replaceChildren();try{state.player=window.createICVideoPlayer({container:mount});await state.player.load(p);setStatus(`Aperçu disponible : ${playableId}`,'ok')}catch(e){setStatus(`Aperçu indisponible : ${e.message}`,'error')}}
function render(){const list=state.assets.filter(matches);$('assets').innerHTML=list.length?list.map(a=>`<article class="asset${a.id===state.assetId?' selected':''}"><h3>${esc(a.title)}</h3><span class="badge">Asset ${esc(a.id)}</span>${a.sources.map(s=>`<div class="source"><strong>${esc(label(s.kind))}</strong><code>${esc(s.url||s.manifestUrl||s.originUrl||s.storageKey||'Source déclarée')}</code></div>`).join('')}<p class="meta">Playables : ${a.playables.map(p=>esc(p.id)).join(', ')}</p><div class="actions">${a.playables.map(p=>`<button type="button" class="secondary select" data-a="${esc(a.id)}" data-p="${esc(p.id)}">${p.id===state.playableId?'Sélectionné':'Sélectionner'} ${esc(p.id)}</button><button type="button" class="secondary preview-button" data-a="${esc(a.id)}" data-p="${esc(p.id)}">Aperçu</button>`).join('')}</div>${a.playables.map(p=>`<div id="preview-${esc(p.id)}" class="preview" hidden><div id="mount-${esc(p.id)}" class="preview-mount"></div></div>`).join('')}</article>`).join(''):'<p>Aucun asset ne correspond aux critères.</p>';$('assets').querySelectorAll('.select').forEach(b=>b.onclick=()=>selectPlayable(b.dataset.a,b.dataset.p));$('assets').querySelectorAll('.preview-button').forEach(b=>b.onclick=()=>preview(b.dataset.a,b.dataset.p))}
async function load(){const r=await fetch('/api/proto05/library/assets');const p=await r.json();if(!r.ok)throw Error(p.error||'Library indisponible.');state.assets=p.assets||[];const qs=new URLSearchParams(location.search),a=qs.get('assetId'),pl=qs.get('playableId');if(a){const asset=state.assets.find(x=>x.id===a);const playable=asset?.playables.find(x=>x.id===pl)||asset?.playables.find(x=>x.id===asset.defaultPlayableId);if(playable)selectPlayable(asset.id,playable.id)}render()}
$('librarySearch').oninput=render;$('libraryFilter').onchange=render;$('create').onclick=async()=>{setStatus('Création…');try{const r=await fetch('/api/proto05/activities',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title:$('title').value,description:$('description').value,videoRef:{schemaVersion:'0.1',assetId:state.assetId,playableId:state.playableId}})});const p=await r.json();if(!r.ok)throw Error(p.error||'Création refusée.');location.href='/teacher/guided/'+encodeURIComponent(p.activity.id)}catch(e){setStatus(e.message,'error')}};load().catch(e=>setStatus(e.message,'error'));
</script></body></html>
