<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Créer une activité — Prototype 05</title><style>body{font-family:Arial;margin:0;padding:30px;background:#f5f7fb}main{max-width:650px;margin:auto;background:#fff;padding:26px;border-radius:12px}label{display:block;font-weight:700;margin:14px 0 5px}input,textarea,select{width:100%;padding:10px;box-sizing:border-box}button,a{display:inline-block;margin-top:18px;padding:10px 14px;background:#325f8f;color:#fff;border:0;border-radius:7px;text-decoration:none;font-weight:700}#status{min-height:1.5em}</style></head><body><main><h1>Créer une activité</h1><p>Création d’un brouillon depuis une vidéo autorisée. L’atelier complet sera disponible après création.</p><label>Titre<input id="title" value="Nouvelle activité"></label><label>Description<textarea id="description"></textarea></label><label>Vidéo autorisée<select id="video"></select></label><button id="create">Créer le brouillon</button> <a href="/teacher">Retour</a><p id="status"></p></main><script>const status=document.getElementById('status'),video=document.getElementById('video');fetch('/api/proto05/video-catalog').then(r=>r.json()).then(p=>video.innerHTML=p.videos.filter(v=>v.authorized).map(v=>`<option value="${v.id}">${v.title}</option>`).join(''));document.getElementById('create').onclick=async()=>{status.textContent='Création…';const r=await fetch('/api/proto05/activities',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title:document.getElementById('title').value,description:document.getElementById('description').value,videoId:video.value})});const p=await r.json();if(!r.ok){status.textContent=p.error||'Création refusée';return}location.href='/teacher/author/'+encodeURIComponent(p.activity.id)};</script></body></html>
