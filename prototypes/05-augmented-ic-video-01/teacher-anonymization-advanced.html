// UX-only projection: keep the manually selected keyframe distinct from the

(function installTemporalSelectionSummary(){
  const timeline=document.querySelector('.timeline');
  if(!timeline)return;
  const summary=document.createElement('small');
  summary.id='positionSummary';
  summary.className='note';
  summary.setAttribute('aria-live','polite');
  const markers=document.createElement('div');
  markers.id='keyMarkers';
  markers.style.cssText='position:relative;height:1.35rem;margin-top:-.35rem;';
  timeline.after(summary,markers);
  const baseRects=renderRects;
  renderRects=function(){
    baseRects();
    const m=mask(),k=keyframe(),t=currentPlaybackMs();
    summary.textContent=m?(k?`Image-clé sélectionnée : ${k.time} ms. Aperçu courant : ${Math.round(t)} ms.`:`Aucune image-clé sélectionnée ; aperçu interpolé à ${Math.round(t)} ms. Les poignées sont désactivées.`):'Aucun masque sélectionné.';
    markers.replaceChildren();
    const duration=Number.isFinite(durationMs())&&durationMs()>0?durationMs():1;
    model.masks.forEach(item=>item.keyframes.forEach(itemKey=>{
      const marker=document.createElement('button');
      marker.type='button';
      marker.className='marker';
      marker.style.cssText=`position:absolute;left:${Math.max(0,Math.min(100,itemKey.time/duration*100))}%;transform:translateX(-50%);top:.2rem;`;
      marker.title=`${item.id} · ${itemKey.time} ms`;

      markers.append(marker);

        if(!isSelected||!selectedKey)return;

          handle:handleName,
          pointerId:event.pointerId,
          targetMask:item,
          targetKeyframe:selectedKey,
          rect,
          start:{x:event.clientX,y:event.clientY,box,position:{x:selectedKey.x,y:selectedKey.y,width:selectedKey.width,height:selectedKey.height}},
          draft:{x:selectedKey.x,y:selectedKey.y,width:selectedKey.width,height:selectedKey.height}
        };
        rect.setPointerCapture?.(event.pointerId);
        event.preventDefault();
      };
      rect.onpointermove=event=>{
        const gesture=drag;
        if(!gesture||gesture.pointerId!==event.pointerId||gesture.maskId!==item.id||gesture.keyframeId!==selectedKey?.__id)return;
        const start=gesture.start,dx=(event.clientX-start.x)/start.box.width,dy=(event.clientY-start.y)/start.box.height;
        const next={...start.position};
        if(gesture.handle==='move'){
          next.x=clamp(start.position.x+dx,0,1-start.position.width);
          next.y=clamp(start.position.y+dy,0,1-start.position.height);
        }else{
          let left=start.position.x,top=start.position.y,right=left+start.position.width,bottom=top+start.position.height;
          if(gesture.handle.includes('w'))left=clamp(start.position.x+dx,0,right-MIN);
          if(gesture.handle.includes('e'))right=clamp(start.position.x+start.position.width+dx,left+MIN,1);
          if(gesture.handle.includes('n'))top=clamp(start.position.y+dy,0,bottom-MIN);
          if(gesture.handle.includes('s'))bottom=clamp(start.position.y+start.position.height+dy,top+MIN,1);
          Object.assign(next,{x:left,y:top,width:right-left,height:bottom-top});
        }
        gesture.draft=next;
        applyTemporalRect(gesture.rect,next);
        event.preventDefault();
      };
      rect.onpointerup=()=>finishMultiMaskDrag(false);
      rect.onpointercancel=()=>finishMultiMaskDrag(true);
      rect.onlostpointercapture=()=>{if(drag)finishMultiMaskDrag(true)};
      layer.append(rect);
    });
    updateSelectionProjection();
  };

  function updateSelectionProjection(){
    const summary=$('positionSummary'),markers=$('keyMarkers');
    if(summary){
      const selected=model.masks.find(item=>item.id===model.selectedMaskId);
      const selectedKey=selected?.keyframes.find(key=>key.__id===model.selectedKeyframeId);
      summary.textContent=selected
        ?(selectedKey?`Image-clé sélectionnée : ${selectedKey.time} ms. Aperçu courant : ${Math.round(currentPlaybackMs())} ms.`:`Aucune image-clé sélectionnée ; aperçu interpolé à ${Math.round(currentPlaybackMs())} ms. Les poignées sont désactivées.`)
        :'Aucun masque sélectionné.';
    }
    if(!markers)return;
    markers.replaceChildren();
    const duration=Number.isFinite(durationMs())&&durationMs()>0?durationMs():1;
    model.masks.forEach(item=>item.keyframes.forEach(itemKey=>{
      const marker=document.createElement('button');
      marker.type='button';
      marker.className='marker';
      marker.style.cssText=`position:absolute;left:${Math.max(0,Math.min(100,itemKey.time/duration*100))}%;transform:translateX(-50%);top:.2rem;`;
      marker.title=`${item.id} · ${itemKey.time} ms`;
      marker.setAttribute('aria-label',`Sélectionner ${item.id}, image-clé ${itemKey.time} ms`);
      if(item.id===model.selectedMaskId&&itemKey.__id===model.selectedKeyframeId){marker.style.background='#2563eb';marker.style.boxShadow='0 0 0 2px #93c5fd'}
      marker.onclick=()=>{model.selectedMaskId=item.id;model.selectedKeyframeId=itemKey.__id;renderList();renderRects()};
      markers.append(marker);
    }));
  }

  function finishMultiMaskDrag(cancelled){
    if(!drag)return;
    const gesture=drag;
    drag=null;
    if(!cancelled&&gesture.targetMask.id===gesture.maskId&&gesture.targetKeyframe.__id===gesture.keyframeId){
      Object.assign(gesture.targetKeyframe,gesture.draft);
      gesture.targetMask.keyframes.sort((a,b)=>a.time-b.time);
      scheduleSave();
      status(`Géométrie enregistrée sur ${gesture.maskId} / ${gesture.keyframeId}; temps inchangé : ${gesture.targetKeyframe.time} ms.`);
    }
    renderList();
    renderRects();
  }

  const originalAddMask=$('addMask').onclick;
  $('addMask').onclick=()=>{
    originalAddMask();
    assignKeyIds();
    const created=mask();
    model.selectedKeyframeId=created?.keyframes[0]?.__id||null;
    renderList();
    renderRects();
  };
  renderRects();
})();
</script></body></html>
