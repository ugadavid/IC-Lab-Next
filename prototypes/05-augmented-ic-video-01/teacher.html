<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bibliothèque d’activités — Proto05</title>
  <link rel="stylesheet" href="/shared/teacher-shell.css">
  <link rel="stylesheet" href="/shared/activity-library.css">
  <script src="/shared/teacher-shell.js" defer></script>
  <script src="/shared/activity-library.js" defer></script>
</head>
<body>
  <main class="activity-library-page">
    <header class="activity-library-header">
      <h1>Bibliothèque d’activités</h1>
      <p>Recherchez, classez et ouvrez les activités pédagogiques de Proto05.</p>
    </header>

    <section class="activity-toolbar" aria-label="Outils de la bibliothèque d’activités">
      <div class="activity-search">
        <label for="activitySearch">Rechercher</label>
        <input id="activitySearch" type="search" placeholder="Titre, identifiant, intention, contexte, vidéo ou dossier" autocomplete="off">
        <button type="button" id="clearSearch" aria-label="Effacer la recherche" hidden>×</button>
      </div>
      <div>
        <label for="activitySort">Trier par</label>
        <select id="activitySort">
          <option value="title-asc">Titre de A à Z</option>
          <option value="title-desc">Titre de Z à A</option>
        </select>
      </div>
      <div>
        <label for="activityStatusFilter">État de la fiche</label>
        <select id="activityStatusFilter">
          <option value="all">Toutes les fiches</option>
          <option value="draft">Brouillons</option>
          <option value="incomplete">Fiches incomplètes</option>
          <option value="complete">Fiches complètes</option>
        </select>
      </div>
      <div class="activity-view-toggle" role="group" aria-label="Mode d’affichage" data-view-controls>
        <button type="button" data-view-choice="grid" aria-pressed="true">Grille</button>
        <button type="button" data-view-choice="list" aria-pressed="false">Liste</button>
      </div>
      <a class="add-activity" href="/teacher/create">Ajouter une activité</a>
    </section>

    <p id="libraryStatus" role="status" aria-live="polite"></p>

    <div class="activity-library-layout">
      <aside class="activity-sidebar" aria-labelledby="classificationTitle">
        <h2 id="classificationTitle">Bibliothèque</h2>
        <nav id="activityFolders" aria-label="Classement des activités"></nav>
      </aside>

      <section class="activity-results-section" aria-labelledby="resultTitle">
        <header class="activity-results-header">
          <h2 id="resultTitle">Toutes les activités</h2>
          <span id="resultCount"></span>
        </header>
        <div id="activityResults" class="activity-results" data-view="grid" aria-live="polite">
          <div class="activity-empty" role="status">Chargement de la bibliothèque…</div>
        </div>
      </section>
    </div>
  </main>

  <dialog id="folderDialog" aria-labelledby="folderDialogTitle">
    <form id="folderForm">
      <h2 id="folderDialogTitle">Ajouter un dossier</h2>
      <label for="folderName">Nom du dossier</label>
      <input id="folderName" name="name" maxlength="120" required autocomplete="off">
      <p class="dialog-status" role="status" aria-live="polite"></p>
      <div class="folder-dialog-actions">
        <button type="button" class="secondary" id="cancelFolder">Annuler</button>
        <button type="submit">Ajouter</button>
      </div>
    </form>
  </dialog>
</body>
</html>
