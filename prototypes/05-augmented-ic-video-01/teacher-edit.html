<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modifier l’activité — Prototype 05</title>
<style>body{margin:0;padding:28px;font-family:Arial,sans-serif;color:#20242c;background:#f5f7fb}main{max-width:760px;margin:auto;background:#fff;padding:26px;border:1px solid #d9e0e8;border-radius:14px}label{display:block;margin:16px 0 6px;font-weight:700}input,textarea,select{width:100%;padding:10px;border:1px solid #cdd6e1;border-radius:7px;font:inherit}textarea{min-height:100px;resize:vertical}.notice{padding:12px;background:#fff4df;color:#7a4c0c;border-radius:8px;font-weight:700}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}button,a{padding:10px 14px;border-radius:8px;border:1px solid #325f8f;background:#325f8f;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}a{background:#fff;color:#325f8f}#status{min-height:1.4em;margin-top:15px}</style></head>
<body><main><h1>Modifier l’activité</h1><p class="notice">Administration locale de prototype — aucune authentification ni gestion réelle des droits.</p><form id="form"><label for="title">Titre</label><input id="title" required maxlength="5000"><label for="description">Description</label><textarea id="description" maxlength="5000"></textarea><label for="instruction">Consigne</label><textarea id="instruction" maxlength="5000"></textarea><label for="question">Question pédagogique</label><textarea id="question" maxlength="5000"></textarea><label for="video">Vidéo autorisée</label><select id="video" required></select><div class="actions"><button type="submit">Enregistrer</button><a href="/teacher">Retour bibliothèque</a><a id="preview" href="#">Ouvrir la prévisualisation</a></div><p id="status" role="status" aria-live="polite"></p></form></main>
<script>
const id=decodeURIComponent(location.pathname.split("/").pop()), form=document.getElementById("form"), status=document.getElementById("status"), video=document.getElementById("video"), preview=document.getElementById("preview");
const fields={title:document.getElementById("title"),description:document.getElementById("description"),instruction:document.getElementById("instruction"),question:document.getElementById("question")};
async function load(){const [a,c]=await Promise.all([fetch(`/api/proto05/activities/${encodeURIComponent(id)}`),fetch("/api/proto05/video-catalog")]);if(!a.ok||!c.ok)throw new Error("Impossible de charger l’activité ou le catalogue vidéo.");const activity=(await a.json()).activity;const catalog=(await c.json()).videos;fields.title.value=activity.title||"";fields.description.value=activity.description||"";fields.instruction.value=activity.instruction||"";fields.question.value=activity.pedagogicalQuestion||"";video.innerHTML=catalog.filter(v=>v.authorized).map(v=>`<option value="${escapeHtml(v.id)}">${escapeHtml(v.title)}</option>`).join("");video.value=activity.video?.id||"";preview.href=`/teacher/preview/${encodeURIComponent(id)}`;}
form.addEventListener("submit",async event=>{event.preventDefault();status.textContent="Sauvegarde…";try{const response=await fetch(`/api/proto05/activities/${encodeURIComponent(id)}`,{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({title:fields.title.value,description:fields.description.value,instruction:fields.instruction.value,pedagogicalQuestion:fields.question.value,videoId:video.value})});const payload=await response.json();if(!response.ok)throw new Error(payload.error||"Sauvegarde refusée.");status.textContent="Sauvegarde réussie. Les vues étudiant et prévisualisation utilisent maintenant ces métadonnées.";preview.href=`/teacher/preview/${encodeURIComponent(id)}?saved=1`; }catch(error){status.textContent="Erreur : "+error.message;}});
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));} load().catch(error=>status.textContent="Erreur : "+error.message);
</script></body></html>
