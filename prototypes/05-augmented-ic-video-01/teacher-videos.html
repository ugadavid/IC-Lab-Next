<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library vidéo — Proto05</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#172033;background:#f6f7fb}*{box-sizing:border-box}body{margin:0;padding:1.5rem;overflow-x:hidden}main{max-width:1280px;margin:auto}.topbar{display:flex;justify-content:space-between;gap:1rem;align-items:start;margin-bottom:1rem}.topbar a{color:#164e63}.panel{background:#fff;border:1px solid #dbe1ea;border-radius:14px;padding:1rem;box-shadow:0 2px 16px #17203312;margin-bottom:1rem}.toolbar{display:grid;grid-template-columns:minmax(220px,2fr) minmax(170px,1fr) minmax(220px,1fr);gap:.75rem;align-items:end}label{display:block;font-weight:650;font-size:.9rem;margin-bottom:.3rem}input,select,button{font:inherit;border:1px solid #9aa5b8;border-radius:7px;padding:.55rem}input,select{width:100%;background:#fff}button{background:#164e63;color:#fff;cursor:pointer}button.secondary{background:#fff;color:#164e63}button:disabled{opacity:.55;cursor:not-allowed}.status{min-height:1.5rem;margin:.75rem 0 0}.status.error{color:#a21caf}.status.ok{color:#166534}.summary{display:flex;justify-content:space-between;gap:1rem;align-items:center}.summary h2{margin:0;font-size:1.05rem}.asset-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:1rem;margin-top:1rem}.asset{border:1px solid #dbe1ea;border-radius:12px;padding:1rem;min-width:0;background:#fff}.asset.selected{border:2px solid #0e7490;box-shadow:0 0 0 3px #0e749022}.asset h3{margin:.2rem 0 .5rem;overflow-wrap:anywhere}.meta{font-size:.86rem;color:#475569;overflow-wrap:anywhere}.badge{display:inline-block;border-radius:999px;padding:.18rem .5rem;margin:.15rem .2rem .15rem 0;background:#e0f2fe;color:#075985;font-size:.78rem}.source{border-top:1px solid #e5e7eb;margin-top:.8rem;padding-top:.75rem}.source strong{display:block}.source code{display:block;white-space:normal;overflow-wrap:anywhere;font-size:.78rem;color:#334155;margin:.3rem 0}.actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.75rem}.actions button{margin:0}.preview{margin-top:.75rem}.preview-mount{width:100%;aspect-ratio:16/9;background:#0f172a;border-radius:8px;overflow:hidden}.preview-mount video,.preview-mount iframe{width:100%;height:100%;display:block}.empty{padding:1.5rem;text-align:center;color:#64748b;border:1px dashed #cbd5e1;border-radius:10px}.form-grid{display:grid;grid-template-columns:1fr 2fr;gap:.75rem}.hidden{display:none!important}.hint{font-size:.85rem;color:#64748b;margin:.35rem 0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:760px){body{padding:.8rem}.topbar{display:block}.toolbar,.form-grid{grid-template-columns:1fr}.asset-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <header class="topbar"><div><a href="/teacher">← Bibliothèque enseignant</a><h1>Library vidéo Proto05</h1><p>Assets, sources et playables contrôlés du Prototype 05.</p></div><div class="meta" id="libraryMeta"></div></header>
  <section class="panel" aria-labelledby="search-title">
    <div class="summary"><h2 id="search-title">Rechercher dans la Library</h2><span id="resultCount" class="meta"></span></div>
    <div class="toolbar">
      <div><label for="search">Recherche</label><input id="search" type="search" placeholder="Titre, identifiant ou type de source" autocomplete="off"></div>
      <div><label for="filter">Source</label><select id="filter"><option value="all">Toutes les sources</option><option value="local-file">Fichier local</option><option value="direct-url">URL directe</option><option value="hls">HLS</option><option value="youtube-embed">YouTube</option></select></div>
      <div><label for="activity">Activité cible</label><select id="activity"><option value="">Aucune activité sélectionnée</option></select></div>
    </div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </section>
  <section class="panel" aria-labelledby="add-title">
    <div class="summary"><h2 id="add-title">Ajouter un asset déclaratif</h2><span class="meta">Aucun fichier n’est importé</span></div>
    <form id="addForm">
      <div class="form-grid">
        <div><label for="assetTitle">Titre</label><input id="assetTitle" maxlength="500" required placeholder="Titre de l’asset"></div>
        <div><label for="sourceKind">Type de source</label><select id="sourceKind"><option value="direct-url">URL directe</option><option value="hls">Manifeste HLS .m3u8</option><option value="local-file">Référence locale déclarative</option></select></div>
      </div>
      <div id="urlField"><label for="sourceValue">URL</label><input id="sourceValue" required autocomplete="off" spellcheck="false" placeholder="https://…/video.mp4"></div>
      <div id="localField" class="hidden"><label for="storageKey">Clé de stockage déclarative</label><input id="storageKey" autocomplete="off" placeholder="library/mon-fichier.mp4"><p class="hint">La clé est enregistrée comme métadonnée ; aucun fichier n’est copié.</p></div>
      <div class="actions"><button type="submit">Ajouter à la Library</button></div>
    </form>
  </section>
  <section class="panel" aria-labelledby="assets-title"><div class="summary"><h2 id="assets-title">Assets disponibles</h2></div><div id="assets" class="asset-grid" aria-live="polite"><div class="empty">Chargement…</div></div></section>
</main>
<script src="/shared/ic-video-player.js"></script>
<script>
const $=id=>document.getElementById(id), state={assets:[],activities:[],selectedAssetId:null,previewPlayer:null};
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kindLabel=kind=>({'local-file':'Fichier local','direct-url':'URL directe','hls':'HLS','youtube-embed':'YouTube'}[kind]||kind||'Source');
const playableValue=playable=>playable.provider==='youtube'?playable.embedUrl:(playable.url||playable.storageKey||'');
function setStatus(message,type=''){const node=$('status');node.className='status '+type;node.textContent=message||''}
function activityIdFromUrl(){return new URLSearchParams(location.search).get('activityId')||''}
function sourceMatches(asset,filter){return filter==='all'||asset.sources.some(source=>source.kind===filter)||asset.playables.some(playable=>playable.kind===filter)}
function visibleAssets(){const query=$('search').value.trim().toLowerCase(),filter=$('filter').value;return state.assets.filter(asset=>{const text=JSON.stringify(asset).toLowerCase();return (!query||text.includes(query))&&sourceMatches(asset,filter)})}
function render(){const assets=visibleAssets();$('resultCount').textContent=`${assets.length} / ${state.assets.length}`;$('libraryMeta').textContent=`${state.assets.length} asset(s)`;const target=$('assets');if(!assets.length){target.innerHTML='<div class="empty">Aucun asset ne correspond aux critères.</div>';return}target.innerHTML=assets.map(asset=>{const selected=asset.id===state.selectedAssetId;const sources=asset.sources.map(source=>`<div class="source"><strong>${esc(kindLabel(source.kind))} · ${esc(source.provider||'—')}</strong><span class="meta">Source : ${esc(source.id)} · Asset : ${esc(source.assetId)}</span><code>${esc(source.url||source.manifestUrl||source.originUrl||source.storageKey||source.embedUrl||'Déclarée sans fichier')}</code></div>`).join('');const playables=asset.playables.map(playable=>{const canPreview=['youtube','uga'].includes(playable.provider)&&Boolean(playable.url||playable.embedUrl);return `<div class="source"><strong>Playable</strong><span class="meta">${esc(playable.id)} · ${esc(kindLabel(playable.kind))} · ${esc(playable.status||'—')}</span><div class="actions">${canPreview?`<button type="button" class="secondary preview-button" data-playable="${esc(playable.id)}" data-asset="${esc(asset.id)}">Aperçu</button>`:''}</div><div id="preview-${esc(playable.id)}" class="preview" hidden><div class="preview-mount"></div></div></div>`}).join('');return `<article class="asset${selected?' selected':''}" data-asset-card="${esc(asset.id)}"><h3>${esc(asset.title)}</h3><div><span class="badge">Asset logique</span><span class="badge">${esc(asset.id)}</span></div><p class="meta">Playable par défaut : <strong>${esc(asset.defaultPlayableId||'—')}</strong></p>${sources}${playables}<div class="actions"><button type="button" class="select-button" data-asset="${esc(asset.id)}">${selected?'Asset sélectionné':'Sélectionner cet asset'}</button><button type="button" class="secondary associate-button" data-asset="${esc(asset.id)}" ${$('activity').value?'':'disabled'}>Associer à l’activité</button></div></article>`}).join('');target.innerHTML=target.innerHTML;target.querySelectorAll('.select-button').forEach(button=>button.addEventListener('click',()=>{state.selectedAssetId=button.dataset.asset;render()}));target.querySelectorAll('.associate-button').forEach(button=>button.addEventListener('click',()=>associate(button.dataset.asset)));target.querySelectorAll('.preview-button').forEach(button=>button.addEventListener('click',()=>preview(button.dataset.asset,button.dataset.playable)));}
async function load(){const [libraryResponse,activitiesResponse]=await Promise.all([fetch('/api/proto05/library/assets'),fetch('/api/proto05/activities')]);const library=await libraryResponse.json(),activities=await activitiesResponse.json();if(!libraryResponse.ok)throw new Error(library.error||'Library indisponible.');state.assets=library.assets||[];state.activities=activities.activities||[];$('activity').innerHTML='<option value="">Aucune activité sélectionnée</option>'+state.activities.map(activity=>`<option value="${esc(activity.id)}">${esc(activity.title||activity.id)}</option>`).join('');const requested=activityIdFromUrl();if(requested&&state.activities.some(activity=>activity.id===requested))$('activity').value=requested;render();}
async function preview(assetId,playableId){const asset=state.assets.find(item=>item.id===assetId),playable=asset?.playables.find(item=>item.id===playableId);if(!playable)return;const shell=$(`preview-${playableId}`);if(!shell)return;shell.hidden=false;const mount=shell.querySelector('.preview-mount');if(state.previewPlayer?.destroy)state.previewPlayer.destroy();mount.replaceChildren();try{state.previewPlayer=window.createICVideoPlayer({container:mount});await state.previewPlayer.load(playable);setStatus(`Aperçu chargé : ${playable.id}`,'ok')}catch(error){setStatus(`Aperçu indisponible : ${error.message}`,'error')}}
async function associate(assetId){const activityId=$('activity').value;if(!activityId){setStatus('Sélectionnez une activité cible avant l’association.','error');return}const asset=state.assets.find(item=>item.id===assetId),playableId=asset?.defaultPlayableId;if(!asset||!playableId)return;setStatus('Association en cours…');try{const response=await fetch(`/api/proto05/activities/${encodeURIComponent(activityId)}/video-ref`,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({assetId,playableId})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Association refusée.');setStatus(`Asset associé à ${data.activity.title||activityId}. activity.video est conservée comme projection.`,'ok')}catch(error){setStatus(error.message,'error')}}
function updateSourceFields(){const local=$('sourceKind').value==='local-file';$('urlField').classList.toggle('hidden',local);$('localField').classList.toggle('hidden',!local);$('sourceValue').required=!local;$('storageKey').required=local;$('sourceValue').placeholder=$('sourceKind').value==='hls'?'https://videos.univ-grenoble-alpes.fr/.../livestream.m3u8':'https://…/video.mp4'}
$('search').addEventListener('input',render);$('filter').addEventListener('change',render);$('activity').addEventListener('change',render);$('sourceKind').addEventListener('change',updateSourceFields);updateSourceFields();
$('addForm').addEventListener('submit',async event=>{event.preventDefault();setStatus('Ajout en cours…');const kind=$('sourceKind').value;const source=kind==='local-file'?{kind,storageKey:$('storageKey').value}:{kind,url:$('sourceValue').value};try{const response=await fetch('/api/proto05/library/assets',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title:$('assetTitle').value,source})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Asset invalide.');$('assetTitle').value='';$('sourceValue').value='';$('storageKey').value='';state.assets.push(data.asset);state.selectedAssetId=data.asset.id;render();setStatus('Asset déclaratif ajouté.','ok')}catch(error){setStatus(error.message,'error')}});load().catch(error=>setStatus(error.message,'error'));
</script>
</body>
</html>
